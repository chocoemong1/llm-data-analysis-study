  <text x="145" y="44" class="title">Evidence 02 · 가상환경과 Python 경로</text>
  <text x="145" y="72" class="sub">활성화 후 실제 실행 파일 및 의존성 검증</text>
  <rect x="42" y="122" width="1316" height="496" rx="14" fill="#010409" stroke="#30363d"/>
  <text x="72" y="174" class="cmd">$ source .venv/bin/activate</text>
  <text x="72" y="208" class="label">VIRTUAL_ENV</text>
