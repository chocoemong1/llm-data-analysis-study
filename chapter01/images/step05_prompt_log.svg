<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" fill="#f6f8fa"/>
  <style>.title{font:700 34px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172b4d}.head{font:700 22px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0969da}.body{font:18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24292f}.arrow{font:700 34px sans-serif;fill:#57606a}.small{font:17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#57606a}</style>
  <text x="60" y="65" class="title">STEP 5 Evidence · Prompt Log와 사람의 판단</text>
  <rect x="55" y="125" width="230" height="150" rx="16" fill="#fff" stroke="#54aeff"/><text x="85" y="168" class="head">1. Prompt</text><text x="85" y="210" class="body">질문 후보 5개</text><text x="85" y="242" class="small">원인 단정 금지</text>
  <text x="300" y="215" class="arrow">→</text>
  <rect x="345" y="125" width="230" height="150" rx="16" fill="#ddf4ff" stroke="#54aeff"/><text x="375" y="168" class="head">2. LLM 초안</text><text x="375" y="210" class="body">월별·카테고리별</text><text x="375" y="242" class="small">고객·상태 분석</text>
  <text x="590" y="215" class="arrow">→</text>
  <rect x="635" y="125" width="230" height="150" rx="16" fill="#fff8c5" stroke="#d4a72c"/><text x="665" y="168" class="head">3. 사람 검증</text><text x="665" y="210" class="body">컬럼·기간·상태</text><text x="665" y="242" class="small">키·결측·계산식</text>
  <text x="880" y="215" class="arrow">→</text>
  <rect x="925" y="125" width="230" height="150" rx="16" fill="#dafbe1" stroke="#4ac26b"/><text x="955" y="168" class="head">4. 수정 후 반영</text><text x="955" y="210" class="body">1~3번 결합</text><text x="955" y="242" class="small">7월 제외·범위 명시</text>
  <rect x="55" y="330" width="1100" height="230" rx="16" fill="#fff" stroke="#d0d7de"/>
  <text x="85" y="375" class="head">기록된 판단</text>
  <text x="85" y="418" class="body">반영: 월별 상품금액·주문 수·주문당 평균과 카테고리 기여</text>
  <text x="85" y="458" class="body">수정: “매출”을 상품금액 대리지표로 한정하고 완전한 월만 비교</text>
  <text x="85" y="498" class="body">보류: 데이터에 없는 마케팅·이탈·계절성 원인 단정</text>
  <text x="85" y="538" class="small">남은 확인: 할인·배송비·세금·부분환불·캠페인·트래픽 데이터</text>
  <text x="60" y="615" class="small">Prompt Log는 AI 제안과 최종 분석 판단의 책임 경계를 재검토할 수 있게 한다.</text>
</svg>
