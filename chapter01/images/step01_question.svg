<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="1200" height="720" fill="#f6f8fa"/>
  <style>.title{font:700 34px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172b4d}.head{font:700 24px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0969da}.body{font:20px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24292f}.small{font:18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#57606a}</style>
  <text x="60" y="65" class="title">STEP 1 Evidence · 업무 질문 구체화</text>
  <rect x="60" y="100" width="1080" height="120" rx="16" fill="#fff" stroke="#d0d7de"/>
  <text x="90" y="145" class="head">원래 질문</text>
  <text x="90" y="190" class="body">“요즘 매출이 줄어든 것 같은데 왜 그런가요?”</text>
  <rect x="60" y="250" width="1080" height="245" rx="16" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="90" y="298" class="head">분석 가능한 질문</text>
  <text x="90" y="345" class="body"><tspan x="90" dy="0">2026년 1월부터 6월까지 completed 주문의 월별 상품금액</tspan><tspan x="90" dy="34">(quantity × unit_price), 완료 주문 수, 주문당 평균금액은 어떻게 변했는가?</tspan><tspan x="90" dy="34">5월 대비 6월 감소액은 어떤 카테고리에서 발생했는가?</tspan></text>
  <text x="90" y="465" class="small">2026년 7월은 8일까지의 불완전한 월이므로 비교에서 제외</text>
  <rect x="60" y="530" width="1080" height="130" rx="16" fill="#fff" stroke="#d0d7de"/>
  <text x="90" y="572" class="body">대상: completed 주문 상품금액 · 기준: 월별/카테고리별</text>
  <text x="90" y="610" class="body">비교: 2026-01~06 및 5→6월 · 목적: 금액 감소의 구성 요인 확인</text>
  <text x="90" y="646" class="small">주의: 상품금액은 할인·배송비·세금·환불 정산을 반영한 회계상 순매출이 아님</text>
</svg>
