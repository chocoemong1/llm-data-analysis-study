<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780">
  <rect width="1200" height="780" fill="#f6f8fa"/>
  <style>.title{font:700 34px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#172b4d}.head{font:700 23px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#0969da}.body{font:18px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#24292f}.small{font:17px 'Noto Sans KR','Malgun Gothic',sans-serif;fill:#57606a}</style>
  <text x="60" y="62" class="title">STEP 3 Evidence · LLM Prompt와 응답 요약</text>
  <rect x="60" y="95" width="1080" height="180" rx="14" fill="#fff" stroke="#d0d7de"/>
  <text x="90" y="135" class="head">Prompt 핵심</text>
  <text x="90" y="175" class="body"><tspan x="90">고객·상품·주문·주문상세 4개 파일로 completed 주문금액과 구매 패턴을</tspan><tspan x="90" dy="31">확인할 질문 5개를 제안하고, 각 질문의 파일·컬럼 후보를 제시할 것.</tspan><tspan x="90" dy="31">현재 데이터로 확인 가능해야 하며 원인을 단정하지 말 것.</tspan></text>
  <rect x="60" y="305" width="1080" height="385" rx="14" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="90" y="347" class="head">LLM 질문 후보</text>
  <text x="95" y="395" class="body">1. 월별 completed 주문 상품금액은 어떻게 변하는가?</text>
  <text x="95" y="445" class="body">2. 월별 완료 주문 수와 주문당 평균금액 중 어느 지표가 변화를 설명하는가?</text>
  <text x="95" y="495" class="body">3. 카테고리별 completed 주문 상품금액의 차이와 월별 기여는 어떠한가?</text>
  <text x="95" y="545" class="body">4. 연령대·도시별 완료 주문 상품금액 분포는 어떠한가?</text>
  <text x="95" y="595" class="body">5. 월별 cancelled·refunded 주문 비중은 어떻게 변하는가?</text>
  <text x="95" y="655" class="small">판단: 1~3을 결합하고 기간·금액 정의·불완전 월 제외 조건을 사람이 추가</text>
  <text x="60" y="742" class="small">사용 LLM: OpenAI Codex · 입력에는 원본 고객 행, API Key, Token을 포함하지 않음</text>
</svg>
